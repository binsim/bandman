name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (SSR)
        run: cargo clippy --locked --features ssr --no-default-features -- -D warnings
      - name: Clippy (hydrate / WASM)
        run: >
          cargo clippy --locked --lib
          --features hydrate --no-default-features
          --target wasm32-unknown-unknown
          -- -D warnings

  check:
    name: Compile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check SSR
        run: cargo check --locked --features ssr --no-default-features
      - name: Check hydrate / WASM
        run: >
          cargo check --locked --lib
          --features hydrate --no-default-features
          --target wasm32-unknown-unknown

  test:
    name: Unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: bandman
          POSTGRES_PASSWORD: bandman
          POSTGRES_DB: bandman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandman -d bandman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bandman:bandman@localhost:5432/bandman
      SESSION_SECRET: ci-test-session-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --locked --features ssr --no-default-features

  e2e:
    name: End-to-end tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: bandman
          POSTGRES_PASSWORD: bandman
          POSTGRES_DB: bandman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandman -d bandman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bandman:bandman@localhost:5432/bandman
      SESSION_SECRET: ci-test-session-secret
      LEPTOS_SITE_ADDR: 127.0.0.1:3000
      LEPTOS_SITE_ROOT: target/site
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e

      - name: Install cargo-leptos
        run: |
          archive="cargo-leptos-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/leptos-rs/cargo-leptos/releases/download/v0.3.10/$archive"
          checksum="128dbbf9c5331c42013130c5a7b5a16957302a11a5d699e7982ba43ec5d7ab25"
          tmp_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error "$url" --output "$tmp_dir/$archive"
          echo "$checksum  $tmp_dir/$archive" | sha256sum --check
          tar -xzf "$tmp_dir/$archive" -C "$tmp_dir"
          mkdir -p "$HOME/.cargo/bin"
          install "$tmp_dir/cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos" \
            "$HOME/.cargo/bin/cargo-leptos"
          cargo leptos --version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: end2end/package-lock.json

      - name: Install Sass
        run: npm install --global sass@1.105.0

      - name: Install Playwright
        working-directory: end2end
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build app
        run: cargo leptos build

      - name: Start server
        run: |
          nohup ./target/debug/bandman > /tmp/bandman-server.log 2>&1 &
          echo $! > /tmp/bandman-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to start"
          cat /tmp/bandman-server.log
          exit 1

      - name: Run Playwright
        working-directory: end2end
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: end2end/playwright-report/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/bandman-server.pid ]; then
            kill "$(cat /tmp/bandman-server.pid)" || true
          fi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bandman
      POSTGRES_PASSWORD: bandman
      POSTGRES_DB: bandman
    ports:
      - "5432:5432"
    volumes:
      - bandman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandman -d bandman"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://bandman:bandman@db:5432/bandman
      SESSION_SECRET: change-me-in-production
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_SITE_ROOT: site
      RUST_LOG: info
    volumes:
      - bandman_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  bandman_pg:
  bandman_uploads:
